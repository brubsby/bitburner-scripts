# KataGo analysis engine on bubtop's RTX 4090 (tools/katago/gpu, README).
# The GPU is shared with the siiva cipher jobs (gpudecrypt); the engine only
# runs while Go is being played. Wide batches, because the card is time-sliced with the
# cipher kernels: each batch waits ~30-45ms for its slice, so latency is set by
# the NUMBER of batches (32 threads: 200 visits in ~300ms; 8 threads: ~700ms).
logDir = /tmp/katago-logs
reportAnalysisWinratesAs = BLACK
maxVisits = 400
# Two analysis threads: the move query and a ponder query can run together.
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 32
nnMaxBatchSize = 32
numNNServerThreadsPerModel = 1
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
cudaUseFP16 = true
