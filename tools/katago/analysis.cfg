# KataGo analysis-engine config for the IPvGO solver backend (tools/katago).
# Small on purpose: this box runs the live game in Chrome with 16GB RAM and
# heavy swap. One position at a time, a small NN cache, CPU (Eigen) threads
# capped. The process is niced to 19 by tools/katago/katago.mjs.
logDir = /tmp/katago-logs
reportAnalysisWinratesAs = BLACK
maxVisits = 400
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 2
nnMaxBatchSize = 4
numNNServerThreadsPerModel = 2
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 12
